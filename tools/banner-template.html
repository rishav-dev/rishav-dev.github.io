<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>banner</title>
<style>
  /* Rendered at 1280x340 by tools/make-banner.mjs into the GitHub profile
     repo's assets/banner.png.

     Rendered rather than hand-written as SVG because GitHub serves profile
     images through a proxy that will not load web fonts. An SVG would fall
     back to whatever the viewer happens to have installed; a PNG carries the
     real typeface. */

  @font-face {
    font-family: "Inter Tight Variable";
    src: url("./fonts/inter-tight.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("./fonts/plex-mono.woff2") format("woff2");
    font-weight: 500;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 340px; overflow: hidden; }

  body {
    position: relative;
    background: #050509;
    color: #f3f3f7;
    font-family: "Inter Tight Variable", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 72px;
    isolation: isolate;
  }

  .bloom { position: absolute; border-radius: 50%; filter: blur(80px); z-index: -2; }
  .b1 { width: 520px; height: 520px; left: -120px; top: -180px;
        background: radial-gradient(circle, rgba(98,88,255,.55), transparent 68%); }
  .b2 { width: 420px; height: 420px; right: 60px; top: -60px;
        background: radial-gradient(circle, rgba(34,217,255,.28), transparent 68%); }
  .b3 { width: 340px; height: 340px; right: -60px; bottom: -140px;
        background: radial-gradient(circle, rgba(255,56,152,.26), transparent 68%); }

  /* The point field, echoing the site's boot sequence. */
  .field {
    position: absolute; inset: 0; z-index: -1; opacity: .4;
    background-image:
      radial-gradient(1.4px 1.4px at 18% 26%, rgba(34,217,255,.9), transparent),
      radial-gradient(1.4px 1.4px at 72% 18%, rgba(178,255,62,.75), transparent),
      radial-gradient(1.4px 1.4px at 44% 66%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.4px 1.4px at 88% 58%, rgba(98,88,255,.85), transparent),
      radial-gradient(1.1px 1.1px at 10% 76%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.1px 1.1px at 62% 88%, rgba(34,217,255,.55), transparent),
      radial-gradient(1.1px 1.1px at 31% 10%, rgba(255,255,255,.4), transparent);
    background-size: 300px 260px;
  }

  header { display: flex; align-items: center; gap: 13px; margin-bottom: 26px; }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px; letter-spacing: .26em; text-transform: uppercase;
    color: rgba(34,217,255,.95);
  }

  h1 { font-weight: 600; font-size: 76px; line-height: .94; letter-spacing: -.045em; }
  h1 .grad {
    background: linear-gradient(100deg, #6258ff, #22d9ff 44%, #b2ff3e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .who {
    margin-top: 28px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 15px;
    letter-spacing: .04em;
    color: rgba(243,243,247,.5);
  }
  .who b { color: rgba(243,243,247,.82); font-weight: 500; }
</style>
</head>
<body>
  <span class="bloom b1"></span>
  <span class="bloom b2"></span>
  <span class="bloom b3"></span>
  <span class="field"></span>

  <header>
    <svg width="34" height="34" viewBox="0 0 32 32">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6258ff"/>
          <stop offset="55%" stop-color="#22d9ff"/>
          <stop offset="100%" stop-color="#b2ff3e"/>
        </linearGradient>
      </defs>
      <path d="M5 24 L12 14 L20 19 L27 7" fill="none" stroke="url(#g)"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="5" cy="24" r="2.6" fill="#6258ff"/>
      <circle cx="27" cy="7" r="2.6" fill="#b2ff3e"/>
    </svg>
    <span class="eyebrow">Rishav Chakravarty</span>
  </header>

  <h1>Built on data.<br /><span class="grad">Driven by curiosity.</span></h1>

  <p class="who">
    <b>M.S. Data Analytics &amp; Computational Social Science</b> · UMass Amherst
    &nbsp;·&nbsp; <b>Co-founder</b>, Kinnovation
  </p>
</body>
</html>
