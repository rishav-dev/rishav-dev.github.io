name: Deploy to GitHub Pages

# This workflow builds the Next.js project and deploys the static output to
# GitHub Pages. It determines the correct `BASE_PATH` based on the name of
# the repository: for a user or organisation site (e.g. `username.github.io`)
# the base path is empty; for a project site (any other repository) the base
# path is `/<repository>`.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Determine BASE_PATH and user
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          USER="${GITHUB_REPOSITORY%%/*}"
          echo "NEXT_PUBLIC_GH_USER=$USER" >> $GITHUB_ENV
          if [[ "$REPO" == *".github.io" ]]; then
            echo "BASE_PATH=" >> $GITHUB_ENV
          else
            echo "BASE_PATH=/$REPO" >> $GITHUB_ENV
          fi
      
      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4